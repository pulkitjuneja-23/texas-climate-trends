# Keep the gridMET archive current — and never publish a copy that looks wrong.
#
# Re-downloads this season's data from the University of Idaho and rewrites the
# "current" part of the Zarr store on R2. Without this the site's fast path
# would slowly fall behind and every recent day would come from the
# airport-station top-up instead.
#
# EVERY 3 HOURS, NOT DAILY (since 2026-09-17). Each run:
#   1. exits in ~20 s with zero uploads if Idaho has nothing new and nothing is
#      on hold — by far the commonest outcome;
#   2. checks a statewide sample of Idaho's data for impossible weather;
#   3. uploads to the SPARE folder (current / current-b), never the live one;
#   4. reads its own upload back and checks it again;
#   5. only then points the site at the new copy.
# If 2 or 4 fails, it HOLDS: the site keeps the last good copy, the reason goes
# in the manifest, and the next run three hours later tries again. That is the
# answer to 2026-09-17, when Idaho served zero rain for Jan-Jul and a grower was
# shown a flat line.
#
# WHEN IT EMAILS. A hold of a few hours is invisible on the site (the nearest
# station fills the most recent days either way), so a held run stays GREEN
# with a summary on the run page. It goes RED — which is what makes GitHub email
# — only once a hold has lasted 24 hours, and then at most once a day.
#
# COST, measured against the live store (260 x 320 cells, 16x16 chunks):
#   1,360 chunks + 11 metadata objects = 1,371 uploads per publish
#   ~41,700 uploads/month against Cloudflare's free 1,000,000 = about 4%
#   (publishes still happen about once a day — only when Idaho has a new day)
#   Actions: ~8 short runs a day, roughly 100-150 minutes a month.
# Storage does not grow: the two folders are overwritten alternately.
#
# NOTE ON THE 60-DAY RULE: GitHub disables scheduled workflows after 60 days of
# no repository activity, but its documentation scopes that to PUBLIC
# repositories, and this one is private — so it should not apply. Community
# reports are not unanimous, so it is worth knowing rather than relying on:
# GitHub emails the owner if it ever happens, and re-enabling is one click in
# the Actions tab. Any push resets the clock. If the data ever looks stuck,
# check this before suspecting a code fault.

name: Refresh gridMET (every 3 hours, checked)

on:
  schedule:
    # Every 3 hours at :20. Picks up Idaho's daily update within a few hours of
    # it landing, and retries a held update without anyone doing anything.
    # Deliberately not on the hour: GitHub queues the enormous number of jobs
    # scheduled at :00, which can delay them by an hour.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload even if nothing new is available upstream"
        type: boolean
        default: false

# Never let two refreshes write the store at once.
concurrency:
  group: gridmet-archive
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Measured at 85 seconds for a full 238-day refresh, and about 20 for a run
    # that finds nothing new. This is a runaway guard, not a target.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Node 24 for two reasons: built-in zstd (zlib.zstdCompressSync), which is
      # why the archive code needs no compression dependency, and type stripping
      # so the .mts script runs without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh the current part
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          node --experimental-strip-types scripts/ingest-gridmet.mts \
            --r2 --part current \
            ${{ inputs.force && '--force' || '' }}
